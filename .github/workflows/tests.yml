name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    # Version fixée : Playwright ne prend pas encore en charge la dernière Ubuntu (26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires (règles, points, voix)
        run: npm test
      - name: Installer Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Scénarios de bout en bout (téléphone + tablette) et couverture
        run: npm run coverage
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-des-tests
          path: coverage/index.html
          if-no-files-found: ignore
